[project]
name = "eshop"
version = "0.2.0"
description = "Ecommerce application with admin panel builded using Django"
readme = "README.md"
authors = [
    { name = "moraisz", email = "marcosviniciusm99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "daphne>=4.2.3",
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
