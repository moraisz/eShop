services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    init: true
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./:/app/
      - venv:/app/.venv
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-eshop_database}
      POSTGRES_USER: ${DB_USERNAME:-eshop_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eshop_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: 128mb
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"

volumes:
  venv:
  db:
